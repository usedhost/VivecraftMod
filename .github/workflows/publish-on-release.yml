name: manual-build

run-name: Manual Build

on:
  workflow_dispatch:      # <-- BOTÃO DE INICIAR MANUAL
  release:
    types: [published]    # opcional; remova se quiser só manual

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew

      - name: Build the mod
        run: ./gradlew build --stacktrace

      - name: Upload JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-mod
          path: |
            **/build/libs/*.jar

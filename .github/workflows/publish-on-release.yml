name: build-mod

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # Checkout do repositório
      - name: Checkout
        uses: actions/checkout@v4

      # Java 21 obrigatório
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Permissão para rodar o gradlew
      - name: Grant execute permission
        run: chmod +x ./gradlew

      # Build do mod
      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      # Upload dos artifacts (todos jars)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-build-output
          path: |
            build/libs/*.jar
            **/build/libs/*.jar
